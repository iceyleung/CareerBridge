   if(state.country)countryPrefs[state.country]={city:state.city,salaryMin:state.salaryMin,salaryMax:state.salaryMax};

const TL_PROXY='';
async function mmTranslate(text,sl,tl){
  const c=new AbortController();const ct=setTimeout(()=>c.abort(),9000);
  try{
    const url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair='+sl+'|'+tl;
    const r=await fetch(url,{signal:c.signal});
    if(!r.ok)throw new Error('http '+r.status);
    const j=await r.json();
    const txt=j&&j.responseData&&j.responseData.translatedText;
    if(!txt||j.responseStatus!==200)throw new Error('empty');
    const div=document.createElement('div');div.innerHTML=txt;
    const out=div.textContent;
    if(!out||out.trim()===text.trim())throw new Error('untranslated');
    return out;
  }finally{clearTimeout(ct);}
}

    const out=(j[0]||[]).map(seg=>seg&&seg[0]?seg[0]:'').join('');
    return out||null;
  }finally{clearTimeout(timer);}
}
async function autoTranslate(dir){
  const err=document.getElementById('assistError');
  let done=0,fail=0;
  err.textContent=A('autoTrBusy');
  const longKeys=['work','internship','campus'];
  for(const key of ASSIST_FIELDS){
    if(key==='name'||key==='contact')continue;
    const src=dir==='ko'?assistantData[key].trim():assistantKorean[key].trim();
    if(!src)continue;
    const dstEl=document.getElementById(dir==='ko'?('assist-ko-'+key):('assist-'+key));
    if(dir==='ko'?assistantKorean[key].trim():assistantData[key].trim())continue;
    try{
      let translated;
      if(longKeys.includes(key)){
        const lines=src.split(/\n+/);const outLines=[];
        for(const ln of lines){const t=ln.trim();if(!t){outLines.push('');continue;}const r=await translateText(t,dir==='ko'?'zh-CN':'ko',dir==='ko'?'ko':'zh-CN');if(!r)throw new Error('empty');outLines.push(r);}
        translated=outLines.join('\n');
      }else{
        const res=await translateText(src,dir==='ko'?'zh-CN':'ko',dir==='ko'?'ko':'zh-CN');
        if(!res)throw new Error('empty');
        translated=res;
      }
      if(dir==='ko')assistantKorean[key]=translated;else assistantData[key]=translated;
      if(dstEl)dstEl.value=translated;
      done++;
    }catch(e){fail++;}
  }
  if(fail&&done===0){err.textContent=A('autoTrFail');}
  else if(fail){err.textContent=A('autoTrPartial').replace('{n}',String(fail));}
  else if(done){err.textContent=A('autoTrDone');}
  else{err.textContent=lang==='zh'?'没有需要翻译的字段（源语言为空，或目标语言已填写）。':'번역할 항목이 없습니다(원문 미입력 또는 대상 언어 이미 작성).';}
}

    {id:2,cat:"class",status:"ready",title:{ko:"중국과 한국 이력서 작성법 차이",zh:"中韩简历写法差异对比"},summary:{ko:"사진, 학력 순서, 스킬 표현, 프로젝트 경험 강조 방식 차이.",zh:"对比照片、学历顺序、技能表述与项目经验强调方式的差异。"},img:"https://images.pexels.com/photos/3183162/pexels-photo-3183162.jpeg?w=1200",read:{ko:"4분",zh:"4 分钟"},detail:{ko:["사진: 한국 이력서에는 보통 정장 증명사진을 사용합니다. 중국 이력서에도 증명사진을 많이 쓰지만 일부 인터넷 기업은 경험을 더 중시하니 채용 요강을 따르세요.","학력 순서: 한국은 최근 학력부터 거꾸로 적는 경우가 많고, 중국은 입학 연도 순으로 쓰는 경우가 많습니다. 지원 양식을 확인하세요.","기술 표현: 한국은 자기소개서에 서술식으로 쓰는 경우가 많고, 중국 이력서는 도구·자격증·프로젝트를 항목별로 나열하는 편입니다. 어느 쪽이든 구체적으로 증거를 드러내세요.","프로젝트 경험: 중국 이력서는 정량적 성과를, 한국 이력서는 직무와의 연관성을 강조합니다. 역할·행동·결과를 모두 적으세요.","형식·이중 언어: 한중 버전은 제출 전 문장별로 의미를 대조하고, 회사가 준 양식의 항목을 임의로 바꾸지 마세요."],zh:["照片：韩国简历（이력서）通常使用正装证件照；中国简历也常用证件照，但部分互联网岗位更看重经历，按招聘方要求选择。","学历顺序：韩国多由最近学历往前倒序撰写；中国常按入学时间从早到晚排列，以目标公司模板为准。","技能表述：韩国常在 자기소개서（自我介绍书）中叙述式表达；中国简历多用要点罗列工具、证书与项目，两种方式都要具体、可验证。","项目经验：中国简历强调可量化成果；韩国简历强调与岗位的关联，两边都应写清角色、行动与结果。","格式与双语：提交中韩双语版本前逐句核对语义；遵守目标公司提供的表格模板，不要自行增删栏目。"]}},
    {id:3,cat:"news",status:"ready",title:{ko:"외국인 유학생 취업 비자 · 필요 서류 체크리스트",zh:"外国留学生就业签证与材料清单"},summary:{ko:"비자 종류, 발급 절차, 준비 서류를 국가별로 정리한 체크리스트.",zh:"按国家整理签证类型、办理流程与材料的清单。"},img:"https://images.pexels.com/photos/3184357/pexels-photo-3184357.jpeg?w=1200",read:{ko:"5분",zh:"5 分钟"},detail:{ko:["비자 종류 확인: 한국 취업은 활동 자격에 맞는 비자(예: E-7 특정활동 등)를 신청하고, 중국 취업은 외국인 중국 취업 허가와 취업 비자 절차를 따릅니다. 최신 공고를 확인하세요.","기본 서류: 여권, 증명사진, 졸업(또는 재학) 증명서, 성적증명서, 언어 성적 증명, 인턴·관련 경력 증명을 준비하세요.","채용 서류: 보통 근로계약서 또는 회사의 채용·초청 자료가 필요하며, 고용주가 함께 준비합니다.","신청 절차: 한국은 출입국·외국인청 홈페이지와 창구를 이용하고, 중국은 취업 허가·거류 허가 절차에 따르며 시간을 넉넉히 확보하세요.","주의: 정책과 서류 요건은 갱신되므로 최종은 양국 공식 발표를 따르고, 이 목록은 일반 참고입니다."],zh:["确认签证类型：在韩就业按资格申请对应签证（如 E-7 特定活动等），在华就业按外国人来华工作许可与工作签证流程办理，以官方公告为准。","基础材料：护照、证件照、毕业（或在读）证明、成绩单、语言成绩证明、实习或相关经历证明。","聘用材料：通常需要聘用合同，或由公司出具的录用通知、邀请材料，由雇主配合提供。","办理流程：在韩可通过 출입국·외국인청（出入境·外国人厅）官网与窗口办理；在华按工作许可、居留许可流程办理，并预留充足时间。","注意：政策与材料要求会更新，最终以两国官方最新发布为准，本清单仅为一般参考。"]}},
    {id:4,cat:"news",status:"ready",title:{ko:"한·중 직장 문화 비교: 의사소통과 회의",zh:"中韩职场文化对比：沟通与会议"},summary:{ko:"보고 문화, 의사결정 속도, 회의 진행 방식 차이를 일반 참고 사례로 정리.",zh:"以一般参考案例梳理汇报文化、决策速度与会议方式的差异。"},img:"https://images.pexels.com/photos/3184338/pexels-photo-3184338.jpeg?w=1200",read:{ko:"3분",zh:"3 分钟"},detail:{ko:["보고 문화: 한국 직장은 위계와 정식 보고를 중시하고 진행 상황을 수시로 보고하는 문화가 있습니다. 중국 직장은 결과와 공유를 더 중시하며 비교적 직접적으로 소통합니다.","의사결정 속도: 한국은 단계별 확인과 합의가 필요한 경우가 많고, 중국 기업(특히 인터넷 기업)은 반복 속도가 빠르고 결정 주기가 짧습니다.","회의 방식: 한국 회의는 예의와 발언 순서를 중시하고 회의 후 확인 절차가 있는 경우가 많습니다. 중국 회의는 효율적 토론과 역할 분담 위주이며, 할 일을 기록해 팔로우업합니다.","소통 어조: 한국 동료에게는 존댓말과 호칭을 신경 쓰고, 중국 팀에서는 의견을 더 직접적으로 말할 수 있으나 상대를 존중하고 이해를 확인하세요.","참고: 한 회사의 방식을 한국 또는 중국 기업 전체의 대표로 단정하지 말고, 입사 전에 해당 회사의 규범을 먼저 확인하세요."],zh:["汇报文化：韩国职场重视层级与正式报告（보고），习惯及时向上级汇报进展；中国职场更看重结果与同步，沟通方式相对直接。","决策速度：韩国决策常需逐层确认、达成共识；中国企业尤其互联网公司迭代快、决策周期短，按公司风格调整。","会议方式：韩国会议注重礼节与发言顺序，会后常有书面确认；中国会议多为高效讨论与分工，记录待办并跟进。","沟通语气：对韩国同事注意敬语与称谓；在中国团队可更直接表达观点，但都应尊重对方、确认理解。","提示：不要把某一家公司的做法当作整个韩国或中国企业的代表，入职前先了解本公司具体规范。"]}},

  const VIDEOS=[
    {id:1,youtubeId:"EHwsEN438zY",ratio:"wide",title:{ko:"영상 ① · 한중 취업 관련",zh:"视频① · 中韩求职相关"},source:"https://youtu.be/EHwsEN438zY?si=X1WfuYP0qRJs4GbS",summary:{ko:"유튜브 영상을 사이트 내 팝업으로 재생합니다.",zh:"在站内弹窗中播放该 YouTube 视频。"}},
    {id:2,youtubeId:"bUNmVESdj44",ratio:"tall",title:{ko:"숏폼 영상 ②",zh:"短视频 ②"},source:"https://youtube.com/shorts/bUNmVESdj44?si=16nh7CtuZWBRLA4u",summary:{ko:"세로형 Shorts 영상입니다.",zh:"竖屏 Shorts 视频。"}},
    {id:3,youtubeId:"zJftVJ8Tdi8",ratio:"tall",title:{ko:"숏폼 영상 ③",zh:"短视频 ③"},source:"https://youtube.com/shorts/zJftVJ8Tdi8?si=5hEvr8oJUCqVPHlN",summary:{ko:"세로형 Shorts 영상입니다.",zh:"竖屏 Shorts 视频。"}}

  const NEWS=[
    {id:1,title:{ko:"한중 이력서 준비 포인트",zh:"中韩双语简历准备要点"},summary:{ko:"이력서 구조, 사진, 학력 순서, 기술 표현, 프로젝트 경험을 점검하세요.",zh:"核对简历结构、照片、学历顺序、技能表述与项目经历。"},detail:{ko:["사진: 일반적으로 정장 또는 단정한 증명사진을 사용하며, 국가별 관행을 확인하세요.","학력 순서: 한국은 보통 최근 학력부터, 중국은 입학 연도 순으로 적는 경우가 많아 지원 양식을 따르세요.","기술 표현: 모호한 단어 대신 도구·프레임워크·수준을 구체적으로 적으세요.","프로젝트 경험: 역할, 수행한 일, 정량적 성과를 STAR 방식으로 정리하세요.","중한 대응: 제출 전에 양국어 문장의 의미와 사실이 일치하는지 직접 대조하세요."],zh:["照片：通常使用正装或整洁证件照，按目标国家惯例选择。","学历顺序：韩国多由最近学历往前写，中国常按入学年份排列，以招聘方格式为准。","技能表述：用具体工具、框架与水平代替笼统形容词。","项目经历：用 STAR 方式写清角色、所做之事与可量化成果。","中韩对应：提交前逐句对照两种语言，确认语义与事实一致。"]}},
    {id:2,title:{ko:"면접 빈출 질문과 답변 틀",zh:"面试高频问题与回答框架"},summary:{ko:"자기소개, 지원 동기, 강점, 경험, 단점, 역질문을 준비하세요.",zh:"准备自我介绍、应聘动机、优势、经历、缺点与反问。"},detail:{ko:["자기소개(30~60초): 지원 직무와 연결되는 강점과 실제 경험을 먼저 제시하세요.","지원 동기: 왜 이 직무·이 기업인지, 본인의 목표와 연결해 설명하세요.","강점과 근거: 강점 하나를 실제 사례와 수치로 뒷받침하세요.","경험 질문: 상황·과제·행동·결과(STAR) 순으로 답변하세요.","단점: 개선하려는 노력과 함께 솔직하게 제시하세요.","역질문: 담당 업무, 팀 협업, 성장 기회에 대해 질문할 내용을 준비하세요."],zh:["自我介绍（30–60 秒）：先给出与目标岗位相关的优势和真实经历。","应聘动机：说明为何选择该岗位与企业，并与个人目标相连。","优势与依据：用真实案例和数据支撑一项优势。","经历问题：按情境、任务、行动、结果（STAR）作答。","缺点：如实说明，并附上正在改进的努力。","反问：准备好询问工作职责、团队协作与成长机会。"]}},
    {id:3,title:{ko:"유학생 취업 비자 · 필요 서류 체크리스트",zh:"留学生就业签证与材料清单"},summary:{ko:"비자 종류, 발급 절차, 준비 서류를 국가별 공고에서 확인하세요.",zh:"按官方公告核对签证类型、办理流程与材料。"},detail:{ko:["비자 종류: 취업비자·구직비자 등 목적에 맞는 종류를 확인하세요.","기본 서류: 여권, 사진, 졸업(예정) 증명서, 성적증명서, 경력·인턴 증명을 준비하세요.","초청·채용 관련: 채용 계약 또는 회사 측 초청 자료가 필요할 수 있습니다.","신청 절차: 관공서·비자 센터의 최신 공고와 서류 제출 방식을 확인하세요.","주의: 최종 요건은 국가별 공식 발표를 따르며, 이 자료는 일반 참고입니다."],zh:["签证类型：确认就业签证、求职签证等与目的相符的类别。","基础材料：护照、照片、毕业（在读）证明、成绩单、实习/经历证明。","聘用材料：可能需要聘用合同或公司出具的邀请材料。","办理流程：查阅官方机关/签证中心的最新公告与提交方式。","注意：最终要求以各国官方发布为准，本资料仅供一般参考。"]}},
    {id:4,title:{ko:"언어 능력 준비와 증명",zh:"语言能力准备与证明"},summary:{ko:"한국어·중국어·영어 능력과 공인 증명을 미리 정리하세요.",zh:"提前整理韩语、中文、英语能力与官方证明。"},detail:{ko:["한국어: TOPIK 급수와 활용 가능 수준을 기록하세요.","중국어: HSK 급수와 회화·작문 수준을 구분해 적으세요.","영어: CEFR 등급 또는 공인 시험 점수를 기재하세요.","증명서: 유효기간과 발급처를 확인하고, 지원 전 재발급 여부를 점검하세요.","실전: 면접에서는 간결하고 명확하게 의견을 전달하는 연습을 하세요."],zh:["韩语：记录 TOPIK 等级与可运用水平。","中文：区分 HSK 等级与口语、写作水平。","英语：填写 CEFR 等级或官方考试分数。","证明材料：核对有效期与出具机构，投递前确认是否需要重发。","实战：练习在面试中简洁清晰地表达观点。"]}},
    {id:5,title:{ko:"구직 채널과 지원 준비",zh:"求职渠道与投递准备"},summary:{ko:"플랫폼, 포트폴리오, 지원 시기와 팔로업을 정리하세요.",zh:"梳理平台、作品集、投递时机与跟进节奏。"},detail:{ko:["채널: 국내외 채용 플랫폼, 학교 취업처, 지인 추천을 함께 활용하세요.","포트폴리오: 프로젝트·과제·작업물을 링크나 파일로 정리하세요.","지원 시기: 채용 공고의 마감과 전형 일정을 캘린더에 기록하세요.","맞춤화: 기업·직무에 맞춰 자기소개와 경험 문구를 조정하세요.","팔로업: 제출 후 일정 기간이 지나면 진행 상황을 예의 있게 확인하세요."],zh:["渠道：结合国内外招聘平台、学校就业部门与熟人推荐。","作品集：把项目、课题与作品整理成链接或文件。","投递时机：把招聘截止日期与流程节点记入日历。","定制化：根据企业与岗位调整自我介绍和经历表述。","跟进：提交后经过一段时间，礼貌地询问进展。"]}}
  ];

  function cEl(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;}
  function catLabel(id){return t("cat."+id);}

  function renderStatic(){
    document.querySelectorAll("[data-cb]").forEach(el=>{el.textContent=t(el.dataset.cb);});
  }

  function renderPosts(){
    const mount=document.getElementById("cbPostGrid");if(!mount)return;mount.replaceChildren();
    const posts=POSTS.slice(0,4);
    posts.forEach(p=>{
      const card=cEl("article","cb-post");
      const thumb=cEl("div","cb-post-thumb");const img=cEl("img");img.src=p.img;img.alt=tr(p.title);img.loading="lazy";thumb.append(img);card.append(thumb);
      const body=cEl("div","cb-post-body");
      body.append(cEl("h3","",tr(p.title)));
      body.append(cEl("p","",tr(p.summary)));
      const foot=cEl("div","cb-post-foot");
      foot.append(cEl("span","",catLabel(p.cat)));
      if(p.status==="pending")foot.append(cEl("span","cb-pending",t("mag.pending")));
      else{foot.append(cEl("span","",t("mag.read")+" · "+tr(p.read)));card.classList.add("cb-post-ready");card.addEventListener("click",()=>openPost(p));}
      body.append(foot);card.append(body);mount.append(card);
    });
  }

  function renderVideos(){
    const grid=document.getElementById("cbVideoGrid");if(!grid)return;grid.replaceChildren();
    VIDEOS.forEach(v=>{
      const card=cEl("article","cb-video-card "+v.ratio);
      const thumb=cEl("div","cb-video-thumb");
      const img=cEl("img");img.src="https://img.youtube.com/vi/"+v.youtubeId+"/hqdefault.jpg";img.alt=tr(v.title);img.loading="lazy";img.addEventListener("error",()=>{img.style.display="none";});thumb.append(img);
      const play=cEl("button","cb-play");play.type="button";play.setAttribute("aria-label","play");
      play.addEventListener("click",()=>openVideo(v));thumb.append(play);card.append(thumb);
      const info=cEl("div","cb-video-info");
      info.append(cEl("h3","",tr(v.title)));
      const meta=cEl("div","cb-video-meta");meta.append(cEl("span","",tr(v.summary)));info.append(meta);
      card.append(info);grid.append(card);
    });
  }

  function renderNews(){
    const grid=document.getElementById("cbNewsGrid");if(!grid)return;grid.replaceChildren();
    NEWS.forEach(n=>{
      const card=cEl("div","cb-news-card");
      card.append(cEl("h3","",tr(n.title)));
      card.append(cEl("p","",tr(n.summary)));
      card.append(cEl("span","cb-news-more",t("news.more")+" →"));
      card.addEventListener("click",()=>openNews(n));
      grid.append(card);
    });
  }

  /* 뷰 전환 (페이지 분할) */
  const VIEWS=["magazine","jobs","resume","interview","analysis"];
  function showView(name){
    if(!VIEWS.includes(name))name="magazine";
    document.querySelectorAll(".cb-view").forEach(v=>v.classList.toggle("active",v.dataset.view===name));
    document.querySelectorAll("#cbNav a").forEach(a=>a.classList.toggle("active",a.dataset.nav===name));
    assistantTab=(name==="resume"||name==="interview"||name==="analysis")?name:"jobs";
    assistRender();
    window.scrollTo({top:0,behavior:"smooth"});
  }

  /* 슬라이드쇼 */
  let idx=0,timer=null,playing=true;
  function initSlides(){
    const wrap=document.getElementById("cbSlides");if(!wrap)return;
    wrap.replaceChildren();
    SLIDES.forEach((s,i)=>{
      const d=cEl("div","cb-slide"+(i===0?" active":""));
      d.style.backgroundImage='url("'+s.img+'")';d.setAttribute("role","img");d.setAttribute("aria-label",tr(s.alt));wrap.append(d);
    });
    const dots=document.getElementById("cbDots");if(dots){dots.replaceChildren();SLIDES.forEach((_,i)=>dots.append(cEl("span",i===0?"active":"")));}
    timer=setInterval(nextSlide,3000);
    const playBtn=document.getElementById("cbPlay");
    if(playBtn)playBtn.addEventListener("click",()=>{
      playing=!playing;
      if(playing){timer=setInterval(nextSlide,3000);playBtn.textContent="⏸";}
      else{clearInterval(timer);playBtn.textContent="▶";}
    });
  }
  function nextSlide(){
    const slides=document.querySelectorAll("#cbSlides .cb-slide");const dots=document.querySelectorAll("#cbDots span");
    if(!slides.length)return;
    slides[idx].classList.remove("active");if(dots[idx])dots[idx].classList.remove("active");
    idx=(idx+1)%slides.length;
    slides[idx].classList.add("active");if(dots[idx])dots[idx].classList.add("active");
  }

  /* 영상 팝업 */
  function openVideo(v){
    const backdrop=document.getElementById("cbPopupBackdrop");
    const body=document.getElementById("cbPopupBody");
    document.getElementById("cbPopupTitle").textContent=tr(v.title);
    body.innerHTML='<iframe src="https://www.youtube.com/embed/'+v.youtubeId+'?rel=0" title="'+tr(v.title)+'" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe><div class="cb-popup-meta"><span>'+t("vid.source")+': '+(v.source?"<a href='"+v.source+"' target='_blank' rel='noopener'>"+v.source+"</a>":"—")+"</span><span>"+tr(v.summary)+"</span></div>";
    backdrop.classList.add("open");
  }

  /* 뉴스 상세 팝업 */
  function openNews(n){
    const backdrop=document.getElementById("cbPopupBackdrop");
    const body=document.getElementById("cbPopupBody");
    document.getElementById("cbPopupTitle").textContent=tr(n.title);
    const list=cEl("div","cb-news-detail");
    const ul=cEl("ul");
    (n.detail[cur()]||[]).forEach(item=>ul.append(cEl("li","",item)));
    list.append(ul);
    body.replaceChildren(list);
    backdrop.classList.add("open");
  }

  /* 매거진 글 상세 팝업 */
  function openPost(p){
    const backdrop=document.getElementById("cbPopupBackdrop");
    const body=document.getElementById("cbPopupBody");
    document.getElementById("cbPopupTitle").textContent=tr(p.title);
    const list=cEl("div","cb-news-detail");
    const intro=cEl("p","cb-post-intro",tr(p.summary));intro.style.color="#536985";intro.style.lineHeight="1.7";list.append(intro);
    const ul=cEl("ul");
    (p.detail[cur()]||[]).forEach(item=>ul.append(cEl("li","",item)));
    list.append(ul);
    body.replaceChildren(list);
    backdrop.classList.add("open");
  }

  function closePopup(){document.getElementById("cbPopupBackdrop").classList.remove("open");}

  document.addEventListener("DOMContentLoaded",()=>{
    initSlides();window.cbRender();
    const close=document.getElementById("cbPopupClose");if(close)close.addEventListener("click",closePopup);
    const bd=document.getElementById("cbPopupBackdrop");if(bd)bd.addEventListener("click",e=>{if(e.target===bd)closePopup();});
    document.querySelectorAll("#cbNav a").forEach(a=>{
      a.addEventListener("click",e=>{e.preventDefault();showView(a.dataset.nav);history.replaceState(null,"","#"+a.dataset.nav);});
    });
    const start=location.hash.replace("#","");
    if(VIEWS.includes(start))showView(start);else showView("magazine");
    window.addEventListener("hashchange",()=>{const m=location.hash.replace("#","");if(VIEWS.includes(m))showView(m);});
  });

  window.cbRender=function(){renderStatic();renderPosts();renderVideos();renderNews();};
})();
</script></body></html>
