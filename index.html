function changeField(key,el,salary=false){
 const next=el.type==='checkbox'?el.checked:el.value;
 if(salary){
  const candidate={...state,...(salaryDraft||{}),[key]:next};
  if(!salaryValid(candidate)){
   salaryDraft={salaryMin:candidate.salaryMin,salaryMax:candidate.salaryMax};
   showSalaryError();return;
  }
  salaryDraft=null;state.salaryMin=candidate.salaryMin;state.salaryMax=candidate.salaryMax;
 }else{
  // Never commit other filters while the salary draft is invalid.
  if(salaryDraft){formRender();showSalaryError();return;}
  if(key==='country'){
   if(state.country)countryPrefs[state.country]={city:state.city,salaryMin:state.salaryMin,salaryMax:state.salaryMax};
   state.country=next;
   const prefs=countryPrefs[next]||{city:'',salaryMin:'',salaryMax:''};
   state.city=next?prefs.city:'';state.salaryMin=next?prefs.salaryMin:'';state.salaryMax=next?prefs.salaryMax:'';

  if(key==='category')state.sub='';
 }
 if(state.country&&['city','salaryMin','salaryMax'].includes(key))countryPrefs[state.country]={city:state.city,salaryMin:state.salaryMin,salaryMax:state.salaryMax};

  if(j.years>0){if(state.years==='')unknown.push(z?'正式经验未评估':'정규 경력 미평가');else if(Number(state.years)<j.years){let related=state.practice&&(state.practice===j.category||(RELATED_CATEGORIES[state.practice]||[]).includes(j.category));diff.push((z?'正式经验要求':'정규 경력 요건')+' '+j.years+(z?'年，当前':'년, 현재 ')+state.years+(z?'年':'년')+(related&&(state.intern||state.project)?(z?'（相关实践仅部分匹配）':'(관련 실습은 부분 일치)'):''));actions.push(z?'积累可证明的相关实践；实习与校园项目不能算作正式工作年限。':'증빙 가능한 실습을 쌓되 인턴·교내 프로젝트를 정규 경력으로 계산하지 마세요.');}}
  let sc=calc(j);
  gaps.push('• '+title+' ['+j.id+']'+(nearUsed?' ('+(z?'放宽条件：':'완화 조건: ')+mismatches(j).map(k=>TXT[locale][k]||k).join('、')+')':'')+(sc.value!==null?' · '+(z?'参考匹配度 ':'참고 매칭 점수 ')+sc.value+'%':'')+'：'+(diff.join('；')||(z?'未发现可确认的不足':'확인된 부족 항목 없음'))+(unknown.length?'；'+(z?'未评估：':'미평가: ')+unknown.join('、'):''));
 }
 lines.push((z?'能力差距（逐条对照本地示例职位）':'역량 차이 (로컬 예시 직무별 비교)')+':\n'+(gaps.join('\n')||(z?'• 无可比较职位':'• 비교 직무 없음')));
 let unique=[...new Set(actions)];if(missing.length)unique.unshift(z?'先补齐未填写的关键条件，避免把未知误判为符合。':'미입력 핵심 정보를 보완해 미확인을 충족으로 오판하지 마세요.');
 if(!unique.length)unique.push(z?'继续核对示例职位的具体要求，准备真实经历与作品证明。':'예시 직무 요건을 확인하고 실제 경험과 작업물 증빙을 준비하세요.');
 lines.push((z?'行动建议（根据差距）':'실행 제안 (역량 차이 기준)')+':\n'+unique.map((x,i)=>(i+1)+'. '+x).join('\n'));
 lines.push((z?'职位衔接':'채용공고 연계')+': '+(z?'返回职位推荐区查看相关示例岗位。':'채용 추천 영역에서 관련 예시 공고를 확인하세요.'));
 lines.push(z?'注意：示例岗位要求不代表真实市场要求；匹配度不是录用概率。':'주의: 예시 직무 요건은 실제 채용시장 기준이 아니며 매칭 점수는 합격 확률이 아닙니다.');

}
function catNameLocale(id){return CATEGORIES.find(c=>c.id===id)?.name[lang]||id;}
function clearResumeFieldErrors(){document.querySelectorAll('.assist-field [data-field-error]').forEach(x=>x.remove());document.querySelectorAll('.assist-field [aria-invalid]').forEach(x=>x.removeAttribute('aria-invalid'));}
function resumeValidation(){
 clearResumeFieldErrors();const errors=[];
 const add=(key,korean,message)=>{const id='assist-'+(korean?'ko-':'')+key;const input=document.getElementById(id);if(!input)return;input.setAttribute('aria-invalid','true');const msg=safeNode('span','bad',message);msg.dataset.fieldError='1';msg.id=id+'-error';input.setAttribute('aria-describedby',msg.id);input.parentElement.append(msg);errors.push(id)};
 if(!sourceValue('name'))add('name',false,lang==='zh'?'请填写姓名。':'이름을 입력하세요.');
 if(!['school','skills','work','internship','campus'].some(k=>sourceValue(k)))add('school',false,lang==='zh'?'请至少填写学校、技能或一项真实经历。':'학교·기술·실제 경험 중 하나 이상 입력하세요.');
 // Do not claim a complete Korean resume while any supplied factual field lacks its counterpart.
 for(const key of ASSIST_FIELDS){if(key==='name'||key==='contact')continue;
  if(sourceValue(key)&&!assistantKorean[key].trim())add(key,true,lang==='zh'?'请填写与中文事实一致的韩文内容，才能生成完整双语简历。':'중국어 원문과 사실이 일치하는 한국어 내용을 입력해야 합니다.');
  if(!sourceValue(key)&&assistantKorean[key].trim())add(key,false,lang==='zh'?'请补充对应中文原文，避免韩文新增未经核对的事实。':'한국어 내용에 대응하는 중국어 원문을 입력하세요.');
 }
 return errors;
}
function generateAssist(kind){
 const error=document.getElementById('assistError');if(kind==='resume'){
  const errors=resumeValidation();if(errors.length){error.textContent=lang==='zh'?'请先完成标红字段的中韩对应内容；未完成前不会生成或覆盖简历。':'표시된 필드의 중한 대응 내용을 완성하세요. 완료 전에는 이력서를 생성하거나 덮어쓰지 않습니다.';document.getElementById(errors[0])?.focus();return;}
 }else clearResumeFieldErrors();
 error.textContent='';if(generated[kind]&&!confirm(A('overwrite')))return;
 let fn={resume:resumeText,interview:interviewText,analysis:analysisText}[kind];generated[kind]={zh:fn('zh'),ko:fn('ko')};showAssistOutput();
}
function showAssistOutput(){let box=document.getElementById('assistOutput');if(!box)return;box.replaceChildren();let value=generated[assistantTab];if(!value)return;box.append(safeNode('p','foot',A('draft')));if(assistantTab==='resume')box.append(safeNode('p','bad',lang==='zh'?'已完成中韩对应字段检查；请人工核对翻译语义和事实一致性。系统不自动翻译或验证语义。':'중한 대응 필드 입력을 확인했습니다. 번역 의미와 사실 일치 여부는 직접 검토하세요. 자동 번역·의미 검증은 제공되지 않습니다.'));let grid=safeNode('div','assist-dual');[['zh','中文'],['ko','한국어']].forEach(([locale,label])=>{let part=safeNode('div','assist-version');part.append(safeNode('h3','',label));let area=document.createElement('textarea');area.value=value[locale];area.rows=17;area.setAttribute('aria-label',label);area.addEventListener('input',()=>{value[locale]=area.value});part.append(area);let copy=safeNode('button','secondary',A('copy'));copy.type='button';copy.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(area.value);copy.textContent=A('copied')}catch(e){area.focus();area.select();try{const ok=document.execCommand('copy');copy.textContent=ok?A('copied'):A('copyFail')}catch(_){copy.textContent=A('copyFail')}}});part.append(copy);grid.append(part)});box.append(grid)}
const originalTranslate=translate;translate=function(){originalTranslate();assistRender()};assistSection();
