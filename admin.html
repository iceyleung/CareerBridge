<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareerBridge 관리자 / 管理者后台</title>
<style>
*{box-sizing:border-box;font-family:system-ui,sans-serif;margin:0;padding:0}
body{padding:20px;max-width:1100px;margin:0 auto;background:#f5f7fa}
h1{text-align:center;margin-bottom:20px;color:#222}
.lang-bar{text-align:right;margin-bottom:16px}
.lang-btn{padding:6px 12px;margin-left:6px;border:none;border-radius:6px;background:#2563eb;color:white;cursor:pointer}
.box{background:#fff;padding:18px;border-radius:10px;margin-bottom:20px;box-shadow:0 2px 8px #00000012}
h2{margin-bottom:14px;font-size:18px;color:#333}
input,textarea{width:100%;padding:10px;margin:8px 0 12px;border:1px solid #ddd;border-radius:6px;font-size:15px}
textarea{min-height:120px;resize:vertical}
button{padding:9px 16px;border:none;border-radius:6px;background:#16a34a;color:#fff;cursor:pointer;font-size:15px}
.del-btn{background:#dc2626}
.item{padding:12px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}
.item:last-child{border-bottom:none}
.tab-wrap{display:flex;gap:8px;margin-bottom:16px}
.tab{padding:8px 14px;border-radius:6px;background:#e5e7eb;cursor:pointer}
.tab.active{background:#2563eb;color:#fff}
.tab-content{display:none}
.tab-content.active{display:block}
</style>
</head>
<body>
<div class="lang-bar">
  <button class="lang-btn" onclick="setLang('zh')">中文</button>
  <button class="lang-btn" onclick="setLang('ko')">한국어</button>
</div>
<h1 data-i18n="title">CareerBridge 管理者后台</h1>

<div class="tab-wrap">
  <div class="tab active" data-tab="magazine" data-i18n="tabMagazine">杂志管理</div>
  <div class="tab" data-tab="jobs" data-i18n="tabJobs">职位推荐管理</div>
  <div class="tab" data-tab="videos" data-i18n="tabVideos">视频管理</div>
</div>

<!-- 杂志 -->
<div class="tab-content active" id="magazine">
  <div class="box">
    <h2 data-i18n="addMagazine">新增杂志文章</h2>
    <input type="text" id="mag_title" data-placeholder="magTitlePlh" placeholder="文章标题">
    <textarea id="mag_content" data-placeholder="magContentPlh" placeholder="文章内容（支持图文）"></textarea>
    <button onclick="addMagazine()" data-i18n="btnAdd">添加</button>
  </div>
  <div class="box">
    <h2 data-i18n="magList">杂志列表</h2>
    <div id="magListWrap"></div>
  </div>
</div>

<!-- 职位 -->
<div class="tab-content" id="jobs">
  <div class="box">
    <h2 data-i18n="addJob">新增职位</h2>
    <input type="text" id="job_title" data-placeholder="jobTitlePlh" placeholder="职位名称">
    <input type="text" id="job_company" data-placeholder="jobCompanyPlh" placeholder="公司名称">
    <input type="text" id="job_location" data-placeholder="jobLocPlh" placeholder="工作地点">
    <input type="text" id="job_salary" data-placeholder="jobSalaryPlh" placeholder="薪资">
    <input type="text" id="job_link" data-placeholder="jobLinkPlh" placeholder="详情链接">
    <button onclick="addJob()" data-i18n="btnAdd">添加</button>
  </div>
  <div class="box">
    <h2 data-i18n="jobList">职位列表</h2>
    <div id="jobListWrap"></div>
  </div>
</div>

<!-- 视频 -->
<div class="tab-content" id="videos">
  <div class="box">
    <h2 data-i18n="addVideo">新增YouTube视频</h2>
    <input type="text" id="v_title" data-placeholder="vTitlePlh" placeholder="视频标题">
    <input type="text" id="v_yt" data-placeholder="vUrlPlh" placeholder="YouTube链接">
    <textarea id="v_desc" data-placeholder="vDescPlh" placeholder="简介（如：上述为真实用户视频分享，仅供参考）"></textarea>
    <button onclick="addVideo()" data-i18n="btnAdd">添加</button>
  </div>
  <div class="box">
    <h2 data-i18n="videoList">视频列表</h2>
    <div id="videoListWrap"></div>
  </div>
</div>

<script>
// ========== 在这里替换成你的Cloudflare Worker地址 ==========
const API_BASE = "https://xxx.xxx.workers.dev";

// 双语字典
const langMap = {
  zh:{
    title:"CareerBridge 管理者后台",
    tabMagazine:"杂志管理",
    tabJobs:"职位推荐管理",
    tabVideos:"视频管理",
    addMagazine:"新增杂志文章",
    magTitlePlh:"文章标题",
    magContentPlh:"文章内容（支持图文）",
    magList:"杂志列表",
    addJob:"新增职位",
    jobTitlePlh:"职位名称",
    jobCompanyPlh:"公司名称",
    jobLocPlh:"工作地点",
    jobSalaryPlh:"薪资",
    jobLinkPlh:"详情链接",
    jobList:"职位列表",
    addVideo:"新增YouTube视频",
    vTitlePlh:"视频标题",
    vUrlPlh:"YouTube链接",
    vDescPlh:"简介（如：上述为真实用户视频分享，仅供参考）",
    videoList:"视频列表",
    btnAdd:"添加",
    btnDel:"删除",
    confirmDel:"确定删除吗？",
    successAdd:"添加成功",
    successDel:"删除成功"
  },
  ko:{
    title:"CareerBridge 관리자 페이지",
    tabMagazine:"매거진 관리",
    tabJobs:"채용 추천 관리",
    tabVideos:"영상 관리",
    addMagazine:"매거진 글 추가",
    magTitlePlh:"글 제목",
    magContentPlh:"글 내용",
    magList:"매거진 목록",
    addJob:"채용 공고 추가",
    jobTitlePlh:"직무명",
    jobCompanyPlh:"회사명",
    jobLocPlh:"근무지",
    jobSalaryPlh:"급여",
    jobLinkPlh:"상세 링크",
    jobList:"채용 목록",
    addVideo:"유튜브 영상 추가",
    vTitlePlh:"영상 제목",
    vUrlPlh:"유튜브 링크",
    vDescPlh:"설명문 (예: 실제 사용자 영상 공유, 참고용)",
    videoList:"영상 목록",
    btnAdd:"추가",
    btnDel:"삭제",
    confirmDel:"정말 삭제하시겠습니까?",
    successAdd:"추가 완료",
    successDel:"삭제 완료"
  }
};
let currentLang = "zh";

// 切换语言
function setLang(lang){
  currentLang = lang;
  document.documentElement.lang = lang==="zh"?"zh-CN":"ko";
  const dict = langMap[lang];
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const k = el.getAttribute("data-i18n");
    el.innerText = dict[k];
  })
  document.querySelectorAll("[data-placeholder]").forEach(el=>{
    const k = el.getAttribute("data-placeholder");
    el.placeholder = dict[k];
  })
}

// Tab切换
document.querySelectorAll(".tab").forEach(tab=>{
  tab.onclick = ()=>{
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    document.querySelectorAll(".tab-content").forEach(c=>c.classList.remove("active"));
    tab.classList.add("active");
    const targetId = tab.dataset.tab;
    document.getElementById(targetId).classList.add("active");
    loadData(targetId);
  }
})

// 请求封装
async function req(path,method="GET",body=null){
  const opt = {method,headers:{"Content-Type":"application/json"}};
  if(body) opt.body = JSON.stringify(body);
  const res = await fetch(`${API_BASE}/${path}`,opt);
  return res.json();
}

// 杂志
async function loadMagazine(){
  const list = await req("magazine");
  const wrap = document.getElementById("magListWrap");
  wrap.innerHTML = list.map(item=>`
  <div class="item">
    <div>${item.title}</div>
    <button class="del-btn" onclick="delItem('magazine',${item.id})" data-i18n="btnDel">删除</button>
  </div>`).join("");
  setLang(currentLang);
}
async function addMagazine(){
  const title = document.getElementById("mag_title").value.trim();
  const content = document.getElementById("mag_content").value.trim();
  if(!title) return alert(langMap[currentLang].confirmDel);
  await req("magazine","POST",{title,content});
  alert(langMap[currentLang].successAdd);
  document.getElementById("mag_title").value="";
  document.getElementById("mag_content").value="";
  loadMagazine();
}

// 职位
async function loadJobs(){
  const list = await req("jobs");
  const wrap = document.getElementById("jobListWrap");
  wrap.innerHTML = list.map(item=>`
  <div class="item">
    <div>${item.title} | ${item.company}</div>
    <button class="del-btn" onclick="delItem('jobs',${item.id})" data-i18n="btnDel">删除</button>
  </div>`).join("");
  setLang(currentLang);
}
async function addJob(){
  const title = document.getElementById("job_title").value.trim();
  const company = document.getElementById("job_company").value.trim();
  const location = document.getElementById("job_location").value.trim();
  const salary = document.getElementById("job_salary").value.trim();
  const link = document.getElementById("job_link").value.trim();
  if(!title) return alert(langMap[currentLang].confirmDel);
  await req("jobs","POST",{title,company,location,salary,link});
  alert(langMap[currentLang].successAdd);
  document.getElementById("job_title").value="";
  document.getElementById("job_company").value="";
  document.getElementById("job_location").value="";
  document.getElementById("job_salary").value="";
  document.getElementById("job_link").value="";
  loadJobs();
}

// 视频
async function loadVideos(){
  const list = await req("videos");
  const wrap = document.getElementById("videoListWrap");
  wrap.innerHTML = list.map(item=>`
  <div class="item">
    <div>${item.title}</div>
    <button class="del-btn" onclick="delItem('videos',${item.id})" data-i18n="btnDel">删除</button>
  </div>`).join("");
  setLang(currentLang);
}
async function addVideo(){
  const title = document.getElementById("v_title").value.trim();
  const yt_url = document.getElementById("v_yt").value.trim();
  const desc = document.getElementById("v_desc").value.trim();
  if(!title) return alert(langMap[currentLang].confirmDel);
  await req("videos","POST",{title,yt_url,desc});
  alert(langMap[currentLang].successAdd);
  document.getElementById("v_title").value="";
  document.getElementById("v_yt").value="";
  document.getElementById("v_desc").value="";
  loadVideos();
}

async function delItem(table,id){
  if(!confirm(langMap[currentLang].confirmDel)) return;
  await req(`${table}/${id}`,"DELETE");
  alert(langMap[currentLang].successDel);
  loadData(table);
}
function loadData(tab){
  if(tab==="magazine") loadMagazine();
  if(tab==="jobs") loadJobs();
  if(tab==="videos") loadVideos();
}
// 初始化
loadMagazine();
</script>
</body>
</html>
